<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris World Model</title>
<style>
  :root { --bg: #15151c; --panel: #1f1f29; --text: #e4e4ec; --muted: #9a9aae; --accent: #7cc4ff; --warn: #ffb86b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         display: flex; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); margin: 2px 0 0; }
  .stage { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  canvas { width: min(100%, 512px); aspect-ratio: 1; image-rendering: pixelated; background: #000;
           border-radius: 6px; outline: none; }
  canvas:focus { box-shadow: 0 0 0 2px var(--accent); }
  .side { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border-radius: 6px; padding: 10px 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { color: var(--muted); }
  select, button { background: #2b2b38; color: var(--text); border: 1px solid #3a3a4a; border-radius: 4px;
                   padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  #status { font-variant-numeric: tabular-nums; white-space: pre-line; }
  .warn { color: var(--warn); }
  kbd { background: #2b2b38; border: 1px solid #3a3a4a; border-bottom-width: 2px; border-radius: 3px;
        padding: 0 5px; font: 12px ui-monospace, monospace; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; color: var(--muted); }
  #held { font: 12px ui-monospace, monospace; color: var(--accent); min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Tetris world model</h1>
    <p class="sub">Every frame is generated by the model from the frames before it and your buttons; no emulator runs.</p>
  </div>
  <div class="stage">
    <canvas id="screen" width="256" height="256" tabindex="0" aria-label="Generated game screen"></canvas>
    <div class="side">
      <div class="card"><div id="status">Loading…</div></div>
      <div class="card row">
        <label for="level">Generated level</label>
        <select id="level"></select>
        <button id="restart">Restart</button>
        <button id="pause">Pause</button>
      </div>
      <div class="card">
        <div class="keys">
          <span><kbd>←</kbd> <kbd>→</kbd> <kbd>↓</kbd></span><span>move, drop</span>
          <span><kbd>X</kbd> <kbd>Z</kbd></span><span>rotate (A, B)</span>
          <span><kbd>Enter</kbd> <kbd>Shift</kbd></span><span>Start, Select</span>
        </div>
        <div id="held"></div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="play.js"></script>
</body>
</html>
